<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Secrétariat — Plateforme Au Cocon (maquette)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/demo-plateforme/demo.css">
</head>
<body>
<main class="page">
  <span class="pastille">Maquette · données fictives</span>
  <header class="haut">
    <h1 class="haut__titre">Secrétariat</h1>
    <p class="haut__sous">Que voulez-vous faire&nbsp;?</p>
  </header>

  <!-- Les deux tâches. Une fois l'une ouverte, les boutons se rangent en petit. -->
  <nav class="choix" id="choix" aria-label="Tâches">
    <a class="action" href="#paiements"><svg class="ico" aria-hidden="true"><use href="#i-paiement"/></svg><span class="action__txt">Paiements du mois</span><svg class="ico ico--fleche" aria-hidden="true"><use href="#i-fleche"/></svg></a>
    <a class="action" href="#notes"><svg class="ico" aria-hidden="true"><use href="#i-notes"/></svg><span class="action__txt">Saisir les notes</span><svg class="ico ico--fleche" aria-hidden="true"><use href="#i-fleche"/></svg></a>
  </nav>

  <!-- Écran 1 : paiements -->
  <section data-vue="paiements" aria-label="Paiements du mois" hidden>
    <div class="carte" style="margin-top:16px">
      <div class="champ"><label for="pay-classe">Classe</label><select class="entree" id="pay-classe"></select></div>
      <p class="doux" style="margin-top:12px" id="pay-resume"></p>
      <ul class="liste" id="pay-liste" style="margin-top:6px"></ul>
    </div>
  </section>

  <!-- Écran 2 : notes -->
  <section data-vue="notes" aria-label="Saisir les notes" hidden>
    <div class="carte" style="margin-top:16px">
      <div class="champs champs--2">
        <div class="champ"><label for="no-classe">Classe</label><select class="entree" id="no-classe"></select></div>
        <div class="champ"><label for="no-matiere">Matière</label><select class="entree" id="no-matiere"></select></div>
      </div>
      <p class="doux" style="margin-top:12px" id="no-resume"></p>
      <ul class="liste" id="no-liste" style="margin-top:6px"></ul>
    </div>
  </section>
</main>

<nav class="nav-bas" aria-label="Navigation">
  <div class="nav-bas__in">
    <a href="/demo-plateforme/"><svg class="ico" aria-hidden="true"><use href="#i-espaces"/></svg>Espaces</a>
    <a href="#paiements"><svg class="ico" aria-hidden="true"><use href="#i-paiement"/></svg>Paiements</a>
    <a href="#notes"><svg class="ico" aria-hidden="true"><use href="#i-notes"/></svg>Notes</a>
  </div>
</nav>

<script src="/demo-plateforme/donnees.js"></script>
<script src="/demo-plateforme/demo.js"></script>
<script>
(function () {
  var D = DEMO, U = DEMO_UI, S = U.etat(), M = D.MOIS_COURANT;
  var $ = function (id) { return document.getElementById(id); };
  var mois = D.MOIS[M].toLowerCase();

  // ===== Paiements =====
  U.selectClasses($("pay-classe"), U.memo("classe") || "CE1");
  function resumePay(el) {
    var n = el.filter(function (e) { return S.paiements[e.id][M]; }).length;
    $("pay-resume").textContent = n + " sur " + el.length + " ont payé " + mois + " · " + U.fcfa(U.classe($("pay-classe").value).scolarite) + " (exemple)";
  }
  function majPay() {
    var el = U.elevesDe($("pay-classe").value);
    $("pay-liste").innerHTML = el.map(function (e) {
      var ok = S.paiements[e.id][M];
      return '<li><span class="liste__txt"><b>' + U.esc(e.prenom + " " + e.nom) + "</b></span>" +
        '<label class="inter"><input type="checkbox" role="switch" data-e="' + e.id + '"' + (ok ? " checked" : "") + ' aria-label="' + U.esc(e.prenom + " " + e.nom) + ' a payé">' +
        '<span class="inter__piste" aria-hidden="true"></span><span class="inter__txt" aria-hidden="true">' + (ok ? "Payé" : "Pas payé") + "</span></label></li>";
    }).join("");
    resumePay(el);
  }
  $("pay-classe").addEventListener("change", function () { U.memo("classe", this.value); majPay(); });
  $("pay-liste").addEventListener("change", function (ev) {
    var cb = ev.target, e = U.eleve(cb.getAttribute("data-e"));
    S.paiements[e.id][M] = cb.checked; U.sauver();
    cb.parentNode.querySelector(".inter__txt").textContent = cb.checked ? "Payé" : "Pas payé";
    resumePay(U.elevesDe(e.classe));
  });

  // ===== Notes =====
  U.selectClasses($("no-classe"), U.memo("classe") || "CE1");
  $("no-matiere").innerHTML = D.MATIERES.map(function (m) { return "<option>" + m + "</option>"; }).join("");
  function resumeNotes(el, m) {
    var moy = U.moyenne(el.map(function (e) { return S.notes[e.id].parMatiere[m]; }));
    $("no-resume").textContent = "Notes d'" + mois + " sur 10 · moyenne de la classe : " + U.note(moy);
  }
  function majNotes() {
    var el = U.elevesDe($("no-classe").value), m = $("no-matiere").value;
    $("no-liste").innerHTML = el.map(function (e) {
      var v = S.notes[e.id].parMatiere[m];
      return '<li><span class="liste__txt"><b>' + U.esc(e.prenom + " " + e.nom) + "</b></span>" +
        '<input class="entree note" type="number" inputmode="decimal" min="0" max="10" step="0.5" data-e="' + e.id + '" value="' + (v == null ? "" : v) +
        '" aria-label="Note de ' + U.esc(e.prenom + " " + e.nom) + " en " + m + '"><span class="appr">' + (D.appreciation(v) || "—") + "</span></li>";
    }).join("");
    resumeNotes(el, m);
  }
  $("no-classe").addEventListener("change", function () { U.memo("classe", this.value); majNotes(); });
  $("no-matiere").addEventListener("change", majNotes);
  $("no-liste").addEventListener("input", function (ev) {
    var t = ev.target, e = U.eleve(t.getAttribute("data-e")), m = $("no-matiere").value;
    var v = t.value === "" ? null : parseFloat(t.value.replace(",", "."));
    if (v !== null && !isNaN(v)) v = Math.max(0, Math.min(10, v)); else v = null;
    S.notes[e.id].parMatiere[m] = v; U.sauver();
    t.nextElementSibling.textContent = D.appreciation(v) || "—";
    resumeNotes(U.elevesDe(e.classe), m);
  });

  U.ecrans({
    defaut: false,
    change: function (vue) {
      $("choix").classList.toggle("is-compact", !!vue);
      if (vue === "paiements") { $("pay-classe").value = U.memo("classe") || $("pay-classe").value; majPay(); }
      if (vue === "notes") { $("no-classe").value = U.memo("classe") || $("no-classe").value; majNotes(); }
    }
  });
})();
</script>
</body>
</html>
