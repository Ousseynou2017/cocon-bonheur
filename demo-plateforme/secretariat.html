<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Secrétariat — Plateforme Au Cocon (maquette)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/demo-plateforme/demo.css">
</head>
<body>
<main class="contenu" id="contenu">
  <div>
    <span class="pastille">Maquette · données fictives</span>
    <div class="entete">
      <h1>Secrétariat</h1>
      <p id="question">Que voulez-vous faire&nbsp;?</p>
    </div>

    <!-- Les deux tâches. Une fois l'une ouverte, elles se rangent en petit. -->
    <nav class="choix" id="choix" aria-label="Tâches">
      <a class="action" href="#paiements"><span class="action__ico"><svg class="ico" aria-hidden="true"><use href="#i-paiement"/></svg></span><span class="action__txt">Paiements du mois</span><span class="action__fleche"><svg class="ico" aria-hidden="true"><use href="#i-fleche"/></svg></span></a>
      <a class="action" href="#notes"><span class="action__ico"><svg class="ico" aria-hidden="true"><use href="#i-notes"/></svg></span><span class="action__txt">Saisir les notes</span><span class="action__fleche"><svg class="ico" aria-hidden="true"><use href="#i-fleche"/></svg></span></a>
    </nav>
  </div>

  <!-- Écran 1 : paiements -->
  <section data-vue="paiements" aria-label="Paiements du mois" hidden>
    <div class="carte" style="margin-top:16px">
      <div class="champ"><label for="pay-classe">Classe</label><select class="entree" id="pay-classe"></select></div>
      <p class="doux" style="margin:14px 0 16px" id="pay-resume"></p>
      <ul class="liste" id="pay-liste"></ul>
    </div>
  </section>

  <!-- Écran 2 : notes, par classe + matière + semestre -->
  <section data-vue="notes" aria-label="Saisir les notes" hidden>
    <div class="carte" style="margin-top:16px">
      <div class="champs champs--3">
        <div class="champ"><label for="no-classe">Classe</label><select class="entree" id="no-classe"></select></div>
        <div class="champ"><label for="no-matiere">Matière</label><select class="entree" id="no-matiere"></select></div>
        <div class="champ"><label for="no-periode">Période</label>
          <select class="entree" id="no-periode">
            <option value="S1">Semestre 1</option>
            <option value="S2">Semestre 2</option>
            <option value="A">Année (calculée)</option>
          </select>
        </div>
      </div>
      <p class="doux" style="margin:14px 0 16px" id="no-resume"></p>
      <ul class="liste" id="no-liste"></ul>
      <p class="mention">Liste des matières par classe à venir.</p>
    </div>
  </section>
</main>

<script src="/demo-plateforme/donnees.js"></script>
<script src="/demo-plateforme/demo.js"></script>
<script>
(function () {
  var D = DEMO, U = DEMO_UI, S = U.etat(), M = D.MOIS_COURANT;
  var $ = function (id) { return document.getElementById(id); };
  var mois = D.MOIS[M].toLowerCase();
  U.coquille({
    espace: "Secrétariat",
    liens: [{ href: "#paiements", ico: "paiement", txt: "Paiements" }, { href: "#notes", ico: "notes", txt: "Notes" }],
    qui: { nom: "Mme Coumba Sarr", role: "Secrétariat (fictive)" }
  });
  var avecNotes = function (c) { return c.notes; };

  // ===== Paiements : les 10 classes =====
  U.selectClasses($("pay-classe"), U.memo("classe") || "CE1");
  function resumePay(el) {
    var n = el.filter(function (e) { return S.paiements[e.id][M]; }).length;
    $("pay-resume").textContent = n + " sur " + el.length + " ont payé " + mois + " · " + U.fcfa(U.classe($("pay-classe").value).scolarite) + " (exemple)";
  }
  function majPay() {
    var el = U.elevesDe($("pay-classe").value);
    $("pay-liste").innerHTML = el.map(function (e) {
      var ok = S.paiements[e.id][M];
      return '<li><span class="liste__txt"><b>' + U.esc(e.prenom + " " + e.nom) + "</b></span>" +
        '<label class="inter"><input type="checkbox" role="switch" data-e="' + e.id + '"' + (ok ? " checked" : "") + ' aria-label="' + U.esc(e.prenom + " " + e.nom) + ' a payé">' +
        '<span class="inter__piste" aria-hidden="true"></span><span class="inter__txt" aria-hidden="true">' + (ok ? "Payé" : "Pas payé") + "</span></label></li>";
    }).join("");
    resumePay(el);
  }
  $("pay-classe").addEventListener("change", function () { U.memo("classe", this.value); majPay(); });
  $("pay-liste").addEventListener("change", function (ev) {
    var cb = ev.target, e = U.eleve(cb.getAttribute("data-e"));
    S.paiements[e.id][M] = cb.checked; U.sauver();
    cb.parentNode.querySelector(".inter__txt").textContent = cb.checked ? "Payé" : "Pas payé";
    resumePay(U.elevesDe(e.classe));
  });

  // ===== Notes : CI → CM2, par semestre ; l'année se calcule =====
  U.selectClasses($("no-classe"), U.memo("classe") || "CE1", avecNotes);
  $("no-matiere").innerHTML = D.MATIERES.map(function (m) { return "<option>" + m + "</option>"; }).join("");
  function valeur(e, m, p) { var n = S.notes[e.id]; return p === "A" ? D.noteAnnee(n, m) : n[p][m]; }
  function resumeNotes(el, m, p) {
    var moy = U.moyenne(el.map(function (e) { return valeur(e, m, p); }));
    $("no-resume").textContent = (p === "A" ? "Année = moyenne des deux semestres" : "Notes sur 10") + " · moyenne de la classe : " + U.note(moy);
  }
  function majNotes() {
    var el = U.elevesDe($("no-classe").value), m = $("no-matiere").value, p = $("no-periode").value;
    $("no-liste").innerHTML = el.map(function (e) {
      var v = valeur(e, m, p);
      return '<li><span class="liste__txt"><b>' + U.esc(e.prenom + " " + e.nom) + "</b></span>" +
        '<input class="entree note" type="number" inputmode="decimal" min="0" max="10" step="0.5" data-e="' + e.id + '" value="' + (v == null ? "" : v) + '"' +
        (p === "A" ? " disabled" : "") + ' aria-label="Note de ' + U.esc(e.prenom + " " + e.nom) + " en " + m + '"><span class="appr">' + (D.appreciation(v) || "—") + "</span></li>";
    }).join("");
    resumeNotes(el, m, p);
  }
  $("no-classe").addEventListener("change", function () { U.memo("classe", this.value); majNotes(); });
  $("no-matiere").addEventListener("change", majNotes);
  $("no-periode").addEventListener("change", majNotes);
  $("no-liste").addEventListener("input", function (ev) {
    var t = ev.target, e = U.eleve(t.getAttribute("data-e")), m = $("no-matiere").value, p = $("no-periode").value;
    if (p === "A") return;
    var v = t.value === "" ? null : parseFloat(t.value.replace(",", "."));
    v = (v === null || isNaN(v)) ? null : Math.max(0, Math.min(10, v));
    S.notes[e.id][p][m] = v; U.sauver();
    t.nextElementSibling.textContent = D.appreciation(v) || "—";
    resumeNotes(U.elevesDe(e.classe), m, p);
  });

  U.ecrans({
    defaut: false,
    change: function (vue) {
      $("choix").classList.toggle("is-compact", !!vue);
      $("question").hidden = !!vue;   // la tâche est choisie : la question ne sert plus
      if (vue === "paiements") { U.selectClasses($("pay-classe"), U.memo("classe") || $("pay-classe").value); majPay(); }
      if (vue === "notes") { U.selectClasses($("no-classe"), U.memo("classe") || $("no-classe").value, avecNotes); majNotes(); }
    }
  });
})();
</script>
</body>
</html>
