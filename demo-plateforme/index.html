<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <p class="avis">

      <svg class="ico" aria-hidden="true"><use href="#i-message"/></svg>Donner mon avis sur WhatsApp

<script src="/demo-plateforme/donnees.js"></script>

  document.getElementById("avis").href = DEMO_UI.wa("Mon avis sur la maquette de la plateforme Au Cocon :\n\n");
