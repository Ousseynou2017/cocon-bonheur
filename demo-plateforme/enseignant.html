<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enseignant — Plateforme Au Cocon (maquette)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/demo-plateforme/demo.css">
</head>
<body>
<main class="page">
  <span class="pastille">Maquette · données fictives</span>
  <header class="haut">
    <h1 class="haut__titre">Bonjour Mme Sow</h1>
    <p class="haut__sous" id="sous"></p>
  </header>

  <!-- Écran 1 : le bouton, puis ce qui est déjà publié aujourd'hui -->
  <section data-vue="jour" aria-label="Aujourd'hui">
    <a class="action" href="#publier"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg><span class="action__txt">Publier l'exercice du jour</span><svg class="ico ico--fleche" aria-hidden="true"><use href="#i-fleche"/></svg></a>
    <h2 class="titre-section">Publiés aujourd'hui</h2>
    <div class="pile" id="jour-liste"></div>
  </section>

  <!-- Écran 2 : le formulaire, sur une seule page -->
  <section data-vue="publier" aria-label="Publier l'exercice du jour" hidden>
    <a class="lien" href="#jour"><svg class="ico" aria-hidden="true"><use href="#i-retour"/></svg>Aujourd'hui</a>
    <form class="carte" id="f-exo" novalidate style="margin-top:8px">
      <div class="champs">
        <div class="champs champs--2">
          <div class="champ"><label for="ex-classe">Classe</label><select class="entree" id="ex-classe"></select></div>
          <div class="champ"><label for="ex-matiere">Matière</label><select class="entree" id="ex-matiere"></select></div>
        </div>
        <div class="champ"><label for="ex-titre">Titre</label><input class="entree" id="ex-titre" dir="auto" autocomplete="off" placeholder="ex. Les sons [on] et [an]"></div>
        <div class="champ"><label for="ex-texte">Texte</label><textarea class="entree" id="ex-texte" dir="auto" placeholder="Ce que l'élève fait à la maison"></textarea></div>
        <div class="fichier">
          <input type="file" id="ex-pdf" accept="application/pdf">
          <label for="ex-pdf" class="btn btn--clair"><svg class="ico" aria-hidden="true"><use href="#i-trombone"/></svg>Joindre un PDF</label>
          <span class="fichier__nom" id="ex-pdf-nom"></span>
        </div>
        <details class="options">
          <summary>Plus d'options</summary>
          <div class="champs champs--2">
            <div class="champ"><label for="ex-date">Date</label><input class="entree" id="ex-date" type="date"></div>
            <div class="champ">
              <span class="label">Audio</span>
              <div class="fichier">
                <input type="file" id="ex-audio" accept="audio/*">
                <label for="ex-audio" class="btn btn--clair">Joindre un audio</label>
                <span class="fichier__nom" id="ex-audio-nom"></span>
              </div>
            </div>
          </div>
        </details>
        <button class="btn btn--plein" type="submit">Publier</button>
      </div>
    </form>
  </section>
</main>

<nav class="nav-bas" aria-label="Navigation">
  <div class="nav-bas__in">
    <a href="/demo-plateforme/"><svg class="ico" aria-hidden="true"><use href="#i-espaces"/></svg>Espaces</a>
    <a href="#jour" data-defaut><svg class="ico" aria-hidden="true"><use href="#i-jour"/></svg>Aujourd'hui</a>
    <a href="#publier"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg>Publier</a>
  </div>
</nav>

<!-- Feuille A4 : invisible à l'écran, seule chose imprimée. -->
<div class="feuille" id="feuille"></div>

<script src="/demo-plateforme/donnees.js"></script>
<script src="/demo-plateforme/demo.js"></script>
<script>
(function () {
  var D = DEMO, U = DEMO_UI, S = U.etat();
  var $ = function (id) { return document.getElementById(id); };
  // Mme Aminata Sow (CE1) : c'est elle qui a l'exercice en arabe.
  var moi = U.prof("p3");
  $("sous").textContent = "Classe de " + moi.classe + " · " + U.dateFr(D.DATE_DEMO);

  function duJour() {
    return S.exercices.filter(function (x) { return x.prof === moi.id && x.date === D.DATE_DEMO; }).reverse();
  }

  // ----- Feuille A4 -----
  function feuille(liste) {
    $("feuille").innerHTML =
      '<div class="feuille__tete"><img src="/images/logo-cocon-262.webp" alt=""><div class="feuille__ecole">Au Cocon Du Bonheur<br>Ouakam, Dakar · 77 884 53 53<br>' + U.esc(moi.nom) + "</div></div>" +
      "<h1>Classe de " + moi.classe + " — " + U.dateFr(D.DATE_DEMO) + "</h1>" +
      '<div class="feuille__nom"><span>Prénom et nom&nbsp;:</span><span>Signature du parent&nbsp;:</span></div>' +
      liste.map(function (x) {
        return '<section class="feuille__exo"><div class="feuille__meta">' + U.esc(x.matiere) + " · " + x.classe + "</div>" +
          '<h2 dir="' + U.sens(x.titre) + '">' + U.esc(x.titre) + '</h2><p class="feuille__texte" dir="' + U.sens(x.texte) + '">' + U.esc(x.texte) + '</p><div class="feuille__lignes"></div></section>';
      }).join("") + '<p class="feuille__pied">Maquette — données fictives</p>';
  }

  function majJour() {
    var l = duJour();
    $("jour-liste").innerHTML = l.length ? l.map(function (x) {
      return U.carteExo(x,
        '<button type="button" class="btn btn--clair" data-imprimer="' + x.id + '"><svg class="ico" aria-hidden="true"><use href="#i-imprimer"/></svg>Imprimer</button>' +
        '<button type="button" class="btn btn--clair" data-pdf="' + x.id + '"><svg class="ico" aria-hidden="true"><use href="#i-telecharger"/></svg>PDF</button>');
    }).join("") : '<p class="doux">Rien de publié pour l\'instant.</p>';
    feuille(l);   // un Ctrl+P du navigateur imprime aussi la bonne feuille
  }
  $("jour-liste").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-imprimer],[data-pdf]"); if (!b) return;
    var id = b.getAttribute("data-imprimer") || b.getAttribute("data-pdf");
    feuille(S.exercices.filter(function (x) { return x.id === id; }));
    if (b.hasAttribute("data-pdf")) {
      U.toast("Choisissez « Enregistrer en PDF »");
      setTimeout(function () { window.print(); }, 700);
    } else window.print();
  });
  // Sur iPhone, print() rend la main tout de suite : on ne remet la feuille
  // « du jour » qu'une fois l'impression finie.
  window.addEventListener("afterprint", function () { feuille(duJour()); });

  // ----- Formulaire -----
  U.selectClasses($("ex-classe"), moi.classe);
  $("ex-matiere").innerHTML = D.MATIERES.map(function (m) { return "<option>" + m + "</option>"; }).join("");
  function vider() {
    $("f-exo").reset();
    $("ex-classe").value = moi.classe; $("ex-date").value = D.DATE_DEMO;
    $("ex-pdf-nom").textContent = "Aucun fichier"; $("ex-audio-nom").textContent = "Aucun fichier";
  }
  ["pdf", "audio"].forEach(function (k) {
    $("ex-" + k).addEventListener("change", function () { $("ex-" + k + "-nom").textContent = this.files[0] ? this.files[0].name : "Aucun fichier"; });
  });
  $("f-exo").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var titre = $("ex-titre").value.trim(), texte = $("ex-texte").value.trim();
    if (!titre) { $("ex-titre").focus(); U.toast("Donnez un titre"); return; }
    if (!texte) { $("ex-texte").focus(); U.toast("Écrivez le texte de l'exercice"); return; }
    var pdf = $("ex-pdf").files[0], audio = $("ex-audio").files[0], date = $("ex-date").value || D.DATE_DEMO;
    S.exercices.push({ id: "x" + Date.now(), prof: moi.id, classe: $("ex-classe").value, matiere: $("ex-matiere").value, date: date,
      titre: titre, texte: texte, pdf: pdf ? pdf.name : "", audio: audio ? audio.name : "" });
    U.sauver(); vider(); majJour();
    location.hash = "jour";
    U.toast(date === D.DATE_DEMO ? "Publié — les parents le voient déjà" : "Programmé pour le " + U.dateFr(date));
  });

  vider(); majJour();
  U.ecrans();
})();
</script>
</body>
</html>
