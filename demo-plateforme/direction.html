<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Direction — Plateforme Au Cocon (maquette)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/demo-plateforme/demo.css">
</head>
<body>
<main class="contenu" id="contenu">
  <!-- Écran 1 : les trois chiffres, puis les familles à relancer -->
  <section data-vue="tableau" aria-labelledby="t1">
    <span class="pastille">Maquette · données fictives</span>
    <div class="entete">
      <h1 id="t1">Tableau de bord</h1>
      <p id="mois"></p>
    </div>
    <div class="chiffres">
      <div class="carte chiffre chiffre--familles"><div class="chiffre__val" id="c-familles"></div><div class="chiffre__lib">familles à jour</div></div>
      <div class="carte chiffre chiffre--argent"><div class="chiffre__val" id="c-argent"></div><div class="chiffre__lib" id="c-argent-lib"></div></div>
      <div class="carte chiffre chiffre--eleves"><div class="chiffre__val" id="c-eleves"></div><div class="chiffre__lib">élèves inscrits</div></div>
    </div>

    <div class="section-titre">
      <h2>À relancer</h2>
      <a class="btn btn--contour" href="#tout" id="voir-tout"></a>
    </div>
    <div class="carte"><ul class="liste" id="relances"></ul></div>
  </section>

  <!-- Écran 2 : toutes les familles pas à jour -->
  <section data-vue="tout" aria-labelledby="t2" hidden>
    <span class="pastille">Maquette · données fictives</span>
    <div class="entete">
      <h1 id="t2">À relancer</h1>
      <p id="tout-sous"></p>
    </div>
    <div class="carte"><ul class="liste" id="relances-tout"></ul></div>
  </section>
</main>

<script src="/demo-plateforme/donnees.js"></script>
<script src="/demo-plateforme/demo.js"></script>
<script>
(function () {
  var D = DEMO, U = DEMO_UI, S = U.etat(), M = D.MOIS_COURANT;
  var mois = D.MOIS[M].toLowerCase();
  var $ = function (id) { return document.getElementById(id); };
  U.coquille({
    espace: "Direction",
    liens: [{ href: "#tableau", ico: "direction", txt: "Tableau de bord", defaut: true }, { href: "#tout", ico: "cloche", txt: "À relancer" }],
    qui: { nom: "Mme Ndèye Faye", role: "Directrice (fictive)" }
  });
  $("mois").textContent = "Octobre · maternelle et élémentaire · montants exemple";

  // Les chiffres se relisent de l'état : une case cochée au secrétariat les fait bouger.
  var aJour = S.parents.filter(function (p) { return U.familleAJour(p, M); });
  var attendu = 0, encaisse = 0;
  S.eleves.forEach(function (e) {
    var s = U.classe(e.classe).scolarite;
    attendu += s; if (S.paiements[e.id][M]) encaisse += s;
  });
  $("c-familles").textContent = Math.round(aJour.length / S.parents.length * 100) + " %";
  $("c-argent").textContent = U.nombre(encaisse) + " F";
  $("c-argent-lib").textContent = "encaissés sur " + U.nombre(attendu) + " F attendus";
  $("c-eleves").textContent = S.eleves.length;

  // Familles pas à jour, avec ce qu'elles doivent ce mois-ci.
  var retard = S.parents.filter(function (p) { return !U.familleAJour(p, M); }).map(function (p) {
    var enf = p.enfants.map(U.eleve).filter(function (e) { return !S.paiements[e.id][M]; });
    return { p: p, enf: enf, du: enf.reduce(function (t, e) { return t + U.classe(e.classe).scolarite; }, 0) };
  });

  function ligne(r) {
    var qui = r.enf.map(function (e) { return e.prenom + " (" + e.classe + ")"; }).join(", ");
    var msg = "[Maquette — relance à envoyer à " + r.p.nom + "]\n\n" +
      "Bonjour " + r.p.nom + ",\nSauf erreur de notre part, la scolarité d'" + mois + " de " + qui + " (" + U.fcfa(r.du) + ") n'est pas encore réglée. " +
      "Merci de passer au secrétariat ou de nous appeler au 77 884 53 53.\nBien cordialement,\nLa direction — Au Cocon Du Bonheur";
    return '<li><span class="liste__txt"><b>' + U.esc(r.p.nom) + "</b><span>" + U.esc(qui) + " · " + U.nombre(r.du) + " F</span></span>" +
      '<a class="btn" target="_blank" rel="noopener" href="' + U.wa(msg) + '">' + U.ico("message") + "Relancer</a></li>";
  }
  $("relances").innerHTML = retard.length ? retard.slice(0, 5).map(ligne).join("") : "<li>Toutes les familles sont à jour.</li>";
  $("relances-tout").innerHTML = retard.map(ligne).join("");
  $("voir-tout").textContent = "Voir tout (" + retard.length + ")";
  $("voir-tout").hidden = retard.length <= 5;
  $("tout-sous").textContent = retard.length + " familles pas à jour en " + mois;

  U.ecrans();
})();
</script>
</body>
</html>
