<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parent — Plateforme Au Cocon (maquette)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/demo-plateforme/demo.css">
</head>
<body>
<main class="page">
  <span class="pastille">Maquette · données fictives</span>
  <header class="haut">
    <h1 class="haut__titre">Bonjour Mme Diallo</h1>
  </header>

  <!-- Écran unique : l'enfant choisi -->
  <section data-vue="enfant" aria-label="Mon enfant">
    <div class="enfants" id="enfants" role="group" aria-label="Enfant"></div>

    <div class="grille-parent">
      <article class="carte">
        <div class="carte__titre"><h2>Exercice du jour</h2></div>
        <div id="exo"></div>
      </article>
      <article class="carte">
        <div class="carte__titre"><h2 id="notes-titre">Notes du mois</h2></div>
        <div id="notes"></div>
      </article>
      <article class="carte">
        <div class="carte__titre"><h2>Paiement</h2><span id="pay-statut"></span></div>
        <p class="doux" id="pay-txt"></p>
      </article>
    </div>

    <p class="discret"><button type="button" class="lien doux" id="bascule"></button></p>
  </section>
</main>

<nav class="nav-bas" aria-label="Navigation">
  <div class="nav-bas__in">
    <a href="/demo-plateforme/"><svg class="ico" aria-hidden="true"><use href="#i-espaces"/></svg>Espaces</a>
    <a href="#enfant" data-defaut><svg class="ico" aria-hidden="true"><use href="#i-parent"/></svg>Mon enfant</a>
  </div>
</nav>

<script src="/demo-plateforme/donnees.js"></script>
<script src="/demo-plateforme/demo.js"></script>
<script>
(function () {
  var D = DEMO, U = DEMO_UI, S = U.etat(), M = D.MOIS_COURANT;
  var $ = function (id) { return document.getElementById(id); };
  var famille = S.parents.filter(function (p) { return p.id === D.FAMILLE_DEMO; })[0];
  // Mamadou (CM1) d'abord, Aïssatou (CI) ensuite.
  var enfants = famille.enfants.map(U.eleve).sort(function (a, b) { return a.prenom === "Mamadou" ? -1 : 1; });
  var choisi = enfants[+(U.memo("enfant") || 0)] || enfants[0];
  var retard = U.memo("retard") === "1";

  $("enfants").innerHTML = enfants.map(function (e, i) {
    return '<button type="button" class="enfant" data-i="' + i + '">' + U.esc(e.prenom) + " · " + e.classe + "</button>";
  }).join("");
  $("enfants").addEventListener("click", function (ev) {
    var b = ev.target.closest(".enfant"); if (!b) return;
    U.memo("enfant", b.getAttribute("data-i"));
    choisi = enfants[+b.getAttribute("data-i")]; tout();
  });
  $("bascule").addEventListener("click", function () { retard = !retard; U.memo("retard", retard ? "1" : "0"); tout(); });

  function tout() {
    [].forEach.call($("enfants").children, function (b, i) { b.setAttribute("aria-pressed", enfants[i] === choisi ? "true" : "false"); });
    var c = U.classe(choisi.classe), mois = D.MOIS[M].toLowerCase();
    var aJour = !retard && S.paiements[choisi.id][M];

    // Exercice du jour : le plus récent publié aujourd'hui pour la classe.
    var ex = S.exercices.filter(function (x) { return x.classe === choisi.classe && x.date === D.DATE_DEMO; });
    $("exo").innerHTML = ex.length ? ex.slice().reverse().map(function (x) {
      return U.carteExo(x).replace('class="carte exo"', 'class="exo"');
    }).join('<hr style="border:0;border-top:1px solid rgb(94 73 102 / .1);margin:18px 0">') : '<p class="doux">Pas d\'exercice aujourd\'hui.</p>';

    // Notes : cachées si la famille n'est pas à jour.
    $("notes-titre").textContent = "Notes d'" + mois;
    if (!aJour) {
      $("notes").innerHTML = '<div class="bloque"><b>Merci de contacter l\'école</b><span class="doux">Secrétariat : 77 884 53 53</span></div>';
    } else {
      var n = S.notes[choisi.id].parMatiere;
      var moy = U.moyenne(D.MATIERES.map(function (m) { return n[m]; }));
      $("notes").innerHTML = '<dl class="notes-l">' + D.MATIERES.map(function (m) {
        return "<dt>" + m + "</dt><dd>" + U.note(n[m]) + ' <span>· ' + (D.appreciation(n[m]) || "—") + "</span></dd>";
      }).join("") + "<dt><b>Moyenne</b></dt><dd><b>" + U.note(moy) + "</b> <span>· " + D.appreciation(moy) + "</span></dd></dl>";
    }

    // Paiement
    $("pay-statut").innerHTML = aJour ? '<span class="statut statut--ok">À jour</span>' : '<span class="statut statut--non">Pas à jour</span>';
    $("pay-txt").textContent = (aJour ? "Octobre réglé · " : "Octobre à régler · ") + U.fcfa(c.scolarite) + " (exemple)";

    $("bascule").textContent = retard ? "Revenir à un parent à jour" : "Voir comme un parent pas à jour";
  }
  tout();
  U.ecrans();
})();
</script>
</body>
</html>
