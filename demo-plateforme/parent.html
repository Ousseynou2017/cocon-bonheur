<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parent — Plateforme Au Cocon (maquette)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/demo-plateforme/demo.css">
</head>
<body>
<main class="contenu" id="contenu">
  <!-- Écran unique : l'enfant choisi -->
  <section data-vue="enfant" aria-labelledby="t1">
    <span class="pastille">Maquette · données fictives</span>
    <div class="entete"><h1 id="t1">Bonjour Mme Diallo</h1></div>
    <div class="enfants" id="enfants" role="group" aria-label="Enfant"></div>

    <div class="grille-parent">
      <article class="carte">
        <div class="carte__titre"><h2>Exercice du jour</h2></div>
        <div id="exo"></div>
      </article>
      <article class="carte">
        <div class="carte__titre"><h2>Notes</h2></div>
        <div id="notes"></div>
      </article>
      <article class="carte">
        <div class="carte__titre"><h2>Paiement</h2><span id="pay-statut"></span></div>
        <p class="doux" id="pay-txt"></p>
      </article>
    </div>

    <p class="discret"><button type="button" class="lien" id="bascule"></button></p>
  </section>
</main>

<script src="/demo-plateforme/donnees.js"></script>
<script src="/demo-plateforme/demo.js"></script>
<script>
(function () {
  var D = DEMO, U = DEMO_UI, S = U.etat(), M = D.MOIS_COURANT;
  var $ = function (id) { return document.getElementById(id); };
  var famille = S.parents.filter(function (p) { return p.id === D.FAMILLE_DEMO; })[0];
  U.coquille({
    espace: "Parent",
    liens: [{ href: "#enfant", ico: "parent", txt: "Mon enfant", defaut: true }],
    qui: { nom: famille.nom, role: "Parent (fictif)" }
  });
  // Mamadou (CM1) d'abord, Aïssatou (CI) ensuite.
  var enfants = famille.enfants.map(U.eleve).sort(function (a) { return a.prenom === "Mamadou" ? -1 : 1; });
  var choisi = enfants[+(U.memo("enfant") || 0)] || enfants[0];
  var retard = U.memo("retard") === "1";

  $("enfants").innerHTML = enfants.map(function (e, i) {
    return '<button type="button" class="enfant" data-i="' + i + '">' + U.esc(e.prenom) + " · " + e.classe + "</button>";
  }).join("");
  $("enfants").addEventListener("click", function (ev) {
    var b = ev.target.closest(".enfant"); if (!b) return;
    U.memo("enfant", b.getAttribute("data-i"));
    choisi = enfants[+b.getAttribute("data-i")]; tout();
  });
  $("bascule").addEventListener("click", function () { retard = !retard; U.memo("retard", retard ? "1" : "0"); tout(); });

  function tout() {
    [].forEach.call($("enfants").children, function (b, i) { b.setAttribute("aria-pressed", enfants[i] === choisi ? "true" : "false"); });
    var c = U.classe(choisi.classe);
    var aJour = !retard && S.paiements[choisi.id][M];

    // Exercice du jour : ce qui est publié aujourd'hui pour la classe.
    var ex = S.exercices.filter(function (x) { return x.classe === choisi.classe && x.date === D.DATE_DEMO; });
    $("exo").innerHTML = ex.length ? ex.slice().reverse().map(function (x) { return U.carteExo(x, "", true); })
      .join('<hr style="border:0;border-top:1px solid var(--bord);margin:20px 0">') : '<p class="doux">Pas d\'exercice aujourd\'hui.</p>';

    // Notes : S1, S2, année (calculée). Cachées si la famille n'est pas à jour.
    if (!aJour) {
      $("notes").innerHTML = '<div class="bloque"><b>Merci de contacter l\'école</b><span class="doux">Secrétariat : 77 884 53 53</span></div>';
    } else {
      var n = S.notes[choisi.id];
      var ann = D.MATIERES.map(function (m) { return D.noteAnnee(n, m); });
      var moy = function (p) { return U.moyenne(D.MATIERES.map(function (m) { return n[p][m]; })); };
      $("notes").innerHTML = '<table class="tab-notes"><thead><tr><th>Matière</th><th>S1</th><th>S2</th><th>Année</th></tr></thead><tbody>' +
        D.MATIERES.map(function (m, i) { return "<tr><td>" + m + "</td><td>" + U.note(n.S1[m]) + "</td><td>" + U.note(n.S2[m]) + '</td><td class="annee">' + U.note(ann[i]) + "</td></tr>"; }).join("") +
        "</tbody><tfoot><tr><td>Moyenne</td><td>" + U.note(moy("S1")) + "</td><td>" + U.note(moy("S2")) + '</td><td class="annee">' + U.note(U.moyenne(ann)) + "</td></tr></tfoot></table>" +
        '<p class="mention">Sur 10 · liste des matières par classe à venir.</p>';
    }

    // Paiement
    $("pay-statut").innerHTML = aJour ? '<span class="statut statut--ok">À jour</span>' : '<span class="statut statut--non">Pas à jour</span>';
    $("pay-txt").textContent = (aJour ? "Octobre réglé · " : "Octobre à régler · ") + U.fcfa(c.scolarite) + " (exemple)";

    $("bascule").textContent = retard ? "Revenir à un parent à jour" : "Voir comme un parent pas à jour";
  }
  tout();
  U.ecrans();
})();
</script>
</body>
</html>
